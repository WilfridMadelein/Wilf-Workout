<div id="exercise-browser-container">

    <section id="exercise-browser">

        <div class="exercise-search-area">

            <!-- EXERCICES + DÉTAILS -->
            <div class="exercise-main-row">

                <!-- RÉSULTATS -->
                <section class="exercise-results">

                    <div class="exercise-results-header">
                        <h2>
                            <span>Exercices</span>
                            <span id="exercise-count" class="exercise-count"></span>
                        </h2>
                    </div>

                    <input type="text" id="search-input" placeholder="Rechercher un exercice...">

                    <div id="exercise-list"></div>

                </section>


                <!-- DÉTAILS -->
                <div class="exercise-details-panel">

                    <h2>Détails</h2>

                    <section id="exercise-details">

                        <div id="details-content">

                            <div class="exercise-detail-header">

                                <div class="progression-navigation">
                                    <button
                                        id="progression-up-button"
                                        class="progression-nav-button"
                                        aria-label="Progression suivante"
                                    >▲</button>

                                    <button
                                        id="progression-down-button"
                                        class="progression-nav-button"
                                        aria-label="Progression précédente"
                                    >▼</button>
                                </div>

                                <h3 id="details-exercise-name">Sélectionne un exercice.</h3>

                            </div>

                            <div id="details-exercise-info"></div>

                        </div>

                    </section>

                </div>

            </div>


            <!-- FILTRES -->
            <section id="exercise-filters">

                <!-- CATÉGORIE -->
                <div class="filter-row">

                    <button class="filter-title" data-filter="category">
                        <span>Catégorie</span>
                        <span class="filter-arrow">▼</span>
                    </button>

                    <div id="category-summary" class="filter-summary"></div>

                </div>

                <div id="category-filter-options" class="filter-options">

                    <div id="category-filters" class="filter-buttons">
                        <button class="filter-button active" data-category="cali">Cali</button>
                        <button class="filter-button active" data-category="gym">Gym</button>
                    </div>

                </div>


                <!-- TYPE -->
                <div class="filter-row">

                    <button class="filter-title" data-filter="type">
                        <span>Type</span>
                        <span class="filter-arrow">▼</span>
                    </button>

                    <div id="type-summary" class="filter-summary"></div>

                </div>

                <div id="type-filter-options" class="filter-options">

                    <div id="type-filters" class="filter-buttons">
                        <button class="filter-button active" data-type="all">Tous</button>
                        <button class="filter-button" data-type="Push">Push</button>
                        <button class="filter-button" data-type="Pull">Pull</button>
                        <button class="filter-button" data-type="Iso">Isométrique</button>
                    </div>

                </div>


                <!-- MUSCLES -->
                <div class="filter-row">

                    <button class="filter-title" data-filter="muscle">
                        <span>Muscles</span>
                        <span class="filter-arrow">▼</span>
                    </button>

                    <div id="muscle-summary" class="filter-summary"></div>

                </div>

                <div id="muscle-filter-options" class="filter-options">

                    <div id="muscle-filters" class="filter-buttons"></div>
                    <div id="submuscle-filters"></div>

                </div>


                <!-- PROGRESSION -->
                <div class="filter-row">

                    <button class="filter-title" data-filter="progression">
                        <span>Progression</span>
                        <span class="filter-arrow">▼</span>
                    </button>

                    <div class="filter-summary progression-summary">

                        <div class="progression-summary-row">
                            <span>Include</span>
                            <div id="progression-include-summary" class="selected-items"></div>
                            <button id="progression-include-add" class="add-filter-button">+</button>
                        </div>

                        <div class="progression-summary-row">
                            <span>Exclude</span>
                            <div id="progression-exclude-summary" class="selected-items"></div>
                            <button id="progression-exclude-add" class="add-filter-button">+</button>
                        </div>

                    </div>

                </div>

                <div id="progression-filter-options" class="filter-options">

                    <div class="progression-filter-panel">

                        <div class="progression-filter-column">
                            <strong>Include</strong>
                            <div id="progression-include-options" class="progression-options"></div>
                        </div>

                        <div class="progression-filter-column">
                            <strong>Exclude</strong>
                            <div id="progression-exclude-options" class="progression-options"></div>
                        </div>

                    </div>

                </div>


                <!-- ÉQUIPEMENTS -->
                <div class="filter-row">

                    <button class="filter-title" data-filter="equipment">
                        <span>Équipements</span>
                        <span class="filter-arrow">▼</span>
                    </button>

                    <div id="equipment-summary" class="filter-summary"></div>

                </div>

                <div id="equipment-filter-options" class="filter-options">

                    <div id="equipment-filters" class="filter-buttons">
                        <button class="filter-button active" data-equipment="all">Tous</button>
                        <button class="filter-button" data-equipment="none">Aucun</button>
                    </div>

                </div>

            </section>

        </div>

    </section>

</div>
