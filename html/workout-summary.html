<!-- =========================================================
     RÉCAPITULATIF D'ENTRAÎNEMENT
========================================================= -->

<div class="workout-summary-shell">

    <header class="workout-summary-topbar">
        <button
            id="workout-summary-exit-button"
            class="workout-summary-exit-button"
            type="button"
            aria-label="Fermer le récapitulatif"
            title="Fermer"
        >
            ×
        </button>
    </header>

    <!-- FÉLICITATIONS -->
    <section class="workout-summary-hero">

        <div
            id="workout-summary-confetti"
            class="workout-summary-confetti"
            aria-hidden="true"
        ></div>

        <h1>Félicitation!</h1>

        <p
            id="workout-summary-message"
            class="workout-summary-message"
        ></p>

    </section>

    <!-- DURÉE -->
    <section class="workout-summary-duration-block">

        <span>Votre entraînement a duré</span>

        <strong
            id="workout-summary-duration"
            class="workout-summary-duration"
        >
            0:00
        </strong>

    </section>

    <!-- STATISTIQUES -->
    <section class="workout-summary-stats">

        <h2>Vous avez fait au total :</h2>

        <div
            id="workout-summary-set-count"
            class="workout-summary-stat"
        >
            0 set
        </div>

        <div
            id="workout-summary-exercise-count"
            class="workout-summary-stat"
        >
            0 exercice
        </div>

        <div
            id="workout-summary-series-count"
            class="workout-summary-stat"
        >
            0 série
        </div>

    </section>

    <!-- EXERCICES -->
    <section class="workout-summary-exercises">

        <h2>Exercices</h2>

<div
    id="workout-summary-exercise-list"
    class="workout-summary-exercise-list"
></div>

<div
    id="workout-summary-exercise-history"
    class="workout-summary-exercise-history"
    hidden
></div>

</section>

    <button
        id="workout-summary-thanks-button"
        class="workout-summary-thanks-button"
        type="button"
    >
        Merci pour le récapitulatif
    </button>

</div>
