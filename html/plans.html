<!-- ACCUEIL DES PLANS -->
<div id="plan-home">

    <h2>Mes plans</h2>
    <div class="plan-home-actions">
    <button id="new-plan-button">
        + Nouveau plan
    </button>

    <button id="download-plans-button">
        Télécharger mes plans
    </button>
</div>

    <div
    id="plans-list"
    class="responsive-columns"
></div>

<div
    id="plan-pdf-modal"
    class="plan-pdf-modal"
    hidden
>
    <div class="plan-pdf-dialog">

        <h3>Télécharger mes plans</h3>

        <p>
            Sélectionne les plans à inclure et
            utilise les flèches pour choisir leur ordre.
        </p>

        <div id="plan-pdf-selection-list"></div>

        <div class="plan-pdf-actions">
            <button
                id="cancel-plan-pdf-button"
                type="button"
            >
                Annuler
            </button>

            <button
                id="confirm-plan-pdf-button"
                type="button"
            >
                Télécharger en PDF
            </button>
        </div>

    </div>
</div>
<div
    id="plan-delete-modal"
    class="plan-pdf-modal"
    hidden
>
    <div class="plan-pdf-dialog plan-delete-dialog">
        <h3>Supprimer le plan</h3>

        <p id="plan-delete-message"></p>

        <div class="plan-pdf-actions">
            <button id="cancel-plan-delete-button" type="button">
                Retour en arrière
            </button>

            <button
                id="confirm-plan-delete-button"
                class="plan-delete-confirm"
                type="button"
            >
                Je supprime
            </button>
        </div>
    </div>
</div>

</div>



<!-- ÉDITION DU PLAN -->
<div id="plan-editor" style="display: none;">

    <button id="back-to-plans-button">← Retour aux plans</button>

    <!-- EN-TÊTE DU PLAN -->
    <div class="plan-header responsive-columns">

        <!-- INFORMATIONS -->
        <div class="plan-info">

            <div class="plan-name-row">

    <button
        id="edit-plan-name-button"
        class="plan-name-edit-button"
        type="button"
        aria-label="Modifier le nom du plan"
        title="Modifier le nom du plan"
    >
        ✎
    </button>

    <h2
        id="current-plan-name"
        class="plan-name-display"
        title="Modifier le nom du plan"
    ></h2>

    <input
        id="current-plan-name-input"
        class="plan-name-input"
        type="text"
        placeholder="Ex : Jour 1 - Leg Day"
        maxlength="80"
        hidden
    >

</div>

            <div class="plan-filters-box">
                <h3>Filtre du plan</h3>
<div id="plan-category-filters"></div>
<div id="plan-equipment-filters"></div>

<label class="plan-filter-checkbox">
    <input type="checkbox" id="plan-auto-add-equipment">
    <span>Ajouter les équipements sélectionnés au plan</span>
</label>

<label class="plan-filter-checkbox">
    <input type="checkbox" id="plan-auto-exclude-progressions" checked>
    <span>Exclure les progressions ajoutées au plan</span>
</label>
            </div>

        </div>


        <!-- PARAMÈTRES -->
        <div class="plan-default-settings">

    <h3>Paramètres du plan</h3>

<div class="plan-settings-grid">

    <div class="plan-settings-column">

        <div class="plan-parameter">
            <label for="plan-sets">Série</label>

            <div class="plan-default-number-control">
                <input
                    type="number"
                    id="plan-sets"
                    class="plan-default-number-input"
                    data-min-chars="3"
                    min="1"
                    max="999"
                    step="1"
                    value="3"
                >

                <div class="plan-default-arrow-stack">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>
            </div>
        </div>


        <div class="plan-parameter">
            <label for="plan-rest">Repos</label>

            <div class="plan-default-number-control">
                <input
                    type="number"
                    id="plan-rest"
                    class="plan-default-number-input"
                    data-min-chars="3"
                    min="0"
                    max="999"
                    step="15"
                    value="60"
                >

                <div class="plan-default-arrow-stack">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>
            </div>

            <span>sec</span>
        </div>


        <div class="plan-parameter">
            <label>Tempo</label>

            <div class="tempo-inputs">

                <div class="plan-default-number-control plan-default-tempo-control">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <input type="number" id="plan-tempo-1" class="plan-default-number-input" data-min-chars="1" min="0" max="999" step="1" value="3">
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>

                <div class="plan-default-number-control plan-default-tempo-control">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <input type="number" id="plan-tempo-2" class="plan-default-number-input" data-min-chars="1" min="0" max="999" step="1" value="0">
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>

                <div class="plan-default-number-control plan-default-tempo-control">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <input type="number" id="plan-tempo-3" class="plan-default-number-input" data-min-chars="1" min="0" max="999" step="1" value="1">
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>

                <div class="plan-default-number-control plan-default-tempo-control">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <input type="number" id="plan-tempo-4" class="plan-default-number-input" data-min-chars="1" min="0" max="999" step="1" value="0">
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>

            </div>
        </div>

    </div>


<div class="plan-volume-column">

    <h4>Volume</h4>

    <div class="plan-volume-settings">

        <div class="plan-parameter">
            <label for="plan-reps">Répétition</label>

            <div class="plan-default-number-control">
                <input
                    type="number"
                    id="plan-reps"
                    class="plan-default-number-input"
                    data-min-chars="3"
                    min="1"
                    max="999"
                    step="1"
                    value="10"
                >

                <div class="plan-default-arrow-stack">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>
            </div>

            <span>Rep</span>
        </div>


        <div class="plan-parameter">
            <label for="plan-time">Durée</label>

            <div class="plan-default-number-control">
                <input
                    type="number"
                    id="plan-time"
                    class="plan-default-number-input"
                    data-min-chars="3"
                    min="1"
                    max="999"
                    step="15"
                    value="30"
                >

                <div class="plan-default-arrow-stack">
                    <button type="button" class="plan-number-arrow" data-direction="1">▲</button>
                    <button type="button" class="plan-number-arrow" data-direction="-1">▼</button>
                </div>
            </div>

            <span>sec</span>
        </div>

    </div>

</div>

</div>

</div>

    </div>


    <!-- EXERCICES DU PLAN -->
    <div class="plan-exercises">

<h2>Plan d'entraînement</h2>

<div class="plan-notes-editor">
    <div id="plan-equipment-editor" class="plan-equipment-editor" hidden>
        <div class="plan-equipment-editor-row">
            <strong>Équipements :</strong>

            <button
                id="add-plan-equipment-button"
                class="add-filter-button"
                type="button"
                aria-label="Ajouter un équipement"
                title="Ajouter un équipement"
            >+</button>

            <div id="plan-equipment-selected"></div>
        </div>

        <div id="plan-equipment-options" class="plan-equipment-options" hidden></div>
    </div>

    <label for="plan-notes-input">Notes :</label>

    <div class="plan-notes-input-wrap">
        <textarea
            id="plan-notes-input"
            rows="1"
            maxlength="500"
            placeholder="Ajouter des notes au plan..."
        ></textarea>

        <span id="plan-notes-counter" class="plan-notes-counter" hidden>
            0 / 500
        </span>
    </div>
</div>

<div id="plan-exercise-list"></div>
<div id="plan-exercise-browser-container"></div>

    </div>

</div>
