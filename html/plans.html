<!-- ACCUEIL DES PLANS -->
<div id="plan-home">

    <h2>Mes plans</h2>

    <button id="new-plan-button">
        + Nouveau plan
    </button>

    <div id="plans-list"></div>

</div>


<!-- CRÉATION DU PLAN -->
<div id="plan-creator" style="display: none;">

    <h2>Nouveau plan</h2>

    <label for="plan-name">
        Nom du plan
    </label>

    <input
        type="text"
        id="plan-name"
        placeholder="Ex : Jour 1 - Leg Day"
    >

    <button id="create-plan-button">
        Créer le plan
    </button>

    <button id="cancel-plan-button">
        Annuler
    </button>

</div>


<!-- ÉDITION DU PLAN -->
<div id="plan-editor" style="display: none;">

    <button id="back-to-plans-button">
        ← Retour aux plans
    </button>


    <!-- EN-TÊTE DU PLAN -->
    <div class="plan-header">

        <!-- INFORMATIONS DU PLAN -->
        <div class="plan-info">

            <h2 id="current-plan-name"></h2>

            <div class="plan-filters-box">

                <h3>Filtre du plan</h3>

                <div id="plan-category-filters"></div>

                <div id="plan-equipment-filters"></div>

            </div>

        </div>


        <!-- PARAMÈTRES PAR DÉFAUT -->
        <div class="plan-default-settings">

            <h3>Paramètres du plan</h3>

            <div class="plan-parameter">

                <label for="plan-sets">
                    Séries
                </label>

                <input
                    type="number"
                    id="plan-sets"
                    min="1"
                    value="3"
                >

            </div>


            <div class="plan-parameter">

                <label for="plan-reps">
                    Répétitions
                </label>

                <input
                    type="number"
                    id="plan-reps"
                    min="1"
                    value="10"
                >

            </div>


            <div class="plan-parameter">

                <label for="plan-time">
                    Durée
                </label>

                <input
                    type="number"
                    id="plan-time"
                    min="1"
                    value="30"
                >

                <span>sec</span>

            </div>


            <div class="plan-parameter">

                <label for="plan-rest">
                    Repos
                </label>

                <input
                    type="number"
                    id="plan-rest"
                    min="0"
                    value="90"
                >

                <span>sec</span>

            </div>


            <div class="plan-parameter">

                <label>Tempo</label>

                <div class="tempo-inputs">

                    <input
                        type="number"
                        id="plan-tempo-1"
                        min="0"
                        value="3"
                    >

                    <input
                        type="number"
                        id="plan-tempo-2"
                        min="0"
                        value="1"
                    >

                    <input
                        type="number"
                        id="plan-tempo-3"
                        min="0"
                        value="1"
                    >

                    <input
                        type="number"
                        id="plan-tempo-4"
                        min="0"
                        value="0"
                    >

                </div>

            </div>

        </div>

    </div>


    <!-- EXERCICES DU PLAN -->
    <div class="plan-exercises">

        <h2>Plan d'entraînement</h2>

        <div id="plan-exercise-list"></div>

        <div id="plan-exercise-browser-container"></div>

    </div>

</div>
