<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout App</title>

    <link rel="stylesheet" href="style.css">
</head>

 

<body>

    <main>

        <header>
        <h1>Workout App</h1>
    </header>

    <div class="app-header">

    <button id="tab-exercises" class="main-tab active">
        Trouver des exercices
    </button>

    <button id="tab-plans" class="main-tab">
        Construire un plan
    </button>

</div>

   

        <div id="page-exercises">

<section id="exercise-browser">

            <h2>Exercices</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Rechercher un exercice..."
            >


            <!-- TYPE -->

            <div class="filter-section">

                <h3>Type</h3>

                <div id="type-filters" class="filter-buttons">

                    <button
    class="filter-button active"
    data-type="all"
>
    Tous
</button>

<button
    class="filter-button"
    data-type="Push"
>
    Push
</button>

<button
    class="filter-button"
    data-type="Pull"
>
    Pull
</button>

<button
    class="filter-button"
    data-type="Isométrique"
>
    Isométrique
</button>

                </div>

            </div>


            <!-- MUSCLE -->

            <div class="filter-section">

                <h3>Muscle</h3>

                <div id="muscle-filters" class="filter-buttons"></div>

                <div id="submuscle-filters"></div>

            </div>


            <!-- ÉQUIPEMENT -->

            <div class="filter-section">

                <h3>Équipement</h3>

                <div id="equipment-filters" class="filter-buttons">

    <button
        class="filter-button active"
        data-equipment="all"
    >
        Tous
    </button>

    <button
        class="filter-button"
        data-equipment="none"
    >
        Aucun
    </button>

</div>

            </div>


            <!-- CATÉGORIE -->

            <div class="filter-section">

                <h3>Catégorie</h3>

                <div id="category-filters" class="filter-buttons">

                    <button
                        class="filter-button active"
                        data-category="cali"
                    >
                        Cali
                    </button>

                    <button
                        class="filter-button active"
                        data-category="gym"
                    >
                        Gym
                    </button>

                </div>

            </div>


            <!-- LISTE DES EXERCICES -->

            <div id="exercise-list"></div>

        </section>


        <!-- DÉTAILS -->

        <section id="exercise-details">

            <h2>Détails</h2>

            <div id="details-content">

                <p>Sélectionne un exercice.</p>

            </div>

        </section>

        </div>

        <section id="page-plans">

    <div id="plan-home">

        <h2>Mes plans</h2>

        <button id="new-plan-button">
            + Nouveau plan
        </button>

        <div id="plans-list"></div>

    </div>


    <div id="plan-creator" style="display: none;">

        <h2>Nouveau plan</h2>

        <label for="plan-name">
            Nom du plan
        </label>

        <input
            type="text"
            id="plan-name"
            placeholder="Ex : Jour 1 - Leg Day"
        >

        <button id="create-plan-button">
            Créer le plan
        </button>

        <button id="cancel-plan-button">
            Annuler
        </button>

    </div>

    <div id="plan-editor" style="display: none;">

    <h2 id="current-plan-name"></h2>

    <button id="back-to-plans-button">
    ← Retour aux plans
</button>

    <div class="plan-settings">

        <div class="plan-setting-group">

            <h3>Cali / Gym</h3>

            <button
                id="plan-cali-button"
                class="plan-option-button active"
            >
                Cali
            </button>

            <button
                id="plan-gym-button"
                class="plan-option-button active"
            >
                Gym
            </button>

        </div>


        <div class="plan-setting-group">

            <h3>Équipement</h3>

            <button
                id="equipment-general-button"
                class="plan-option-button active"
            >
                Général
            </button>

            <button
                id="equipment-custom-button"
                class="plan-option-button"
            >
                Personnalisé
            </button>

        </div>

    </div>


    <div class="plan-exercises">

        <h3>Exercices</h3>

        <div id="plan-exercise-list"></div>

        <button id="add-exercise-button">
        + Ajouter un exercice
        </button>

        <div id="plan-exercise-browser-container"></div>

    </div>

</div>


</section>

    </main>


    <script src="data/exercises.js"></script>
    <script src="data/muscles.js"></script>
    <script src="data/equipement.js"></script>
    
    <script src="js/app.js"></script>

</body>

</html>
