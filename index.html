<main>

    <!-- EN-TÊTE -->
    <header>
        <h1>Wilf-Workout</h1>
    </header>

    <!-- MISE À JOUR APK -->
    <section id="wilf-update-banner" class="wilf-update-banner" aria-live="polite" hidden>
        <strong id="wilf-update-banner-title">Mise à jour disponible</strong>
        <p id="wilf-update-banner-description"></p>
        <div class="wilf-update-banner-actions">
            <button id="wilf-update-banner-open" type="button">Voir la mise à jour</button>
            <button id="wilf-update-banner-dismiss" type="button">Plus tard</button>
        </div>
    </section>

    <!-- ONGLETS -->
    <nav class="app-header" aria-label="Navigation principale">
        <button id="tab-exercises" class="main-tab active" type="button" aria-current="page"><span class="main-tab-icon" aria-hidden="true">🔍︎</span><span class="main-tab-label">Exercices</span></button>
        <button id="tab-plans" class="main-tab" type="button"><span class="main-tab-icon" aria-hidden="true">🗒</span><span class="main-tab-label">Mes plans</span></button>
        <button id="tab-history" class="main-tab" type="button"><span class="main-tab-icon" aria-hidden="true">🗄</span><span class="main-tab-label">Historique</span></button>
        <button id="tab-settings" class="main-tab" type="button"><span class="main-tab-icon" aria-hidden="true">⚙</span><span class="main-tab-label">Paramètres</span></button>
    </nav>

    <!-- PAGES -->
    <div id="page-exercises"></div>
    <section id="page-plans"></section>
    <section id="page-history"></section>
    <section id="page-settings"></section>
    <section id="page-workout-summary" hidden></section>

</main>

<!-- EXÉCUTION D'UN ENTRAÎNEMENT -->
<section id="page-workout-execution" hidden></section>
