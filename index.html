<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout App</title>

    <link rel="stylesheet" href="style.css">
</head>

 

<body>

    <main>

        <header>
        <h1>Workout App</h1>
    </header>

    <div class="app-header">

    <button id="tab-exercises" class="main-tab active">
        Trouver des exercices
    </button>

    <button id="tab-plans" class="main-tab">
        Construire un plan
    </button>

</div>

   

        <div id="page-exercises">

<section id="exercise-browser">

            <h2>Exercices</h2>

            <input
                type="text"
                id="search-input"
                placeholder="Rechercher un exercice..."
            >


            <!-- TYPE -->

            <div class="filter-section">

                <h3>Type</h3>

                <div id="type-filters" class="filter-buttons">

                    <button
    class="filter-button active"
    data-type="all"
>
    Tous
</button>

<button
    class="filter-button"
    data-type="Push"
>
    Push
</button>

<button
    class="filter-button"
    data-type="Pull"
>
    Pull
</button>

<button
    class="filter-button"
    data-type="Isométrique"
>
    Isométrique
</button>

                </div>

            </div>


            <!-- MUSCLE -->

            <div class="filter-section">

                <h3>Muscle</h3>

                <div id="muscle-filters" class="filter-buttons"></div>

                <div id="submuscle-filters"></div>

            </div>


            <!-- ÉQUIPEMENT -->

            <div class="filter-section">

                <h3>Équipement</h3>

                <div id="equipment-filters" class="filter-buttons">

    <button
        class="filter-button active"
        data-equipment="all"
    >
        Tous
    </button>

    <button
        class="filter-button"
        data-equipment="none"
    >
        Aucun
    </button>

</div>

            </div>


            <!-- CATÉGORIE -->

            <div class="filter-section">

                <h3>Catégorie</h3>

                <div id="category-filters" class="filter-buttons">

                    <button
                        class="filter-button active"
                        data-category="cali"
                    >
                        Cali
                    </button>

                    <button
                        class="filter-button active"
                        data-category="gym"
                    >
                        Gym
                    </button>

                </div>

            </div>


            <!-- LISTE DES EXERCICES -->

            <div id="exercise-list"></div>

        </section>


        <!-- DÉTAILS -->

        <section id="exercise-details">

            <h2>Détails</h2>

            <div id="details-content">

                <p>Sélectionne un exercice.</p>

            </div>

        </section>

        </div>

        <section id="page-plans">

    <h2>Construire un plan</h2>

    <p>La construction de plans sera ajoutée ici.</p>

</section>

    </main>


    <script src="data/exercises.js"></script>
    <script src="data/muscles.js"></script>
    <script src="data/equipement.js"></script>
    
    <script src="js/app.js"></script>

</body>

</html>
